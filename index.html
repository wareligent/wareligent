<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="google-site-verification" content="jtOri-08JOo4FRPGJNtPLuNYGFZOGe4iuoDu6Os0ATM" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wareligent Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-container">
        <!-- ব্র্যান্ড লোগো -->
        <h1 class="brand-logo">wareligent</h1>

        <!-- সার্চ বক্স সেকশন -->
        <div class="search-box-container">
            <div class="search-input-wrapper">
                <input type="text" id="searchInput" placeholder="Search the web with Wareligent..." autocomplete="off">
                <button id="searchBtn" type="button">🔍</button>
            </div>
            <!-- লাইভ অটো-সাজেশন -->
            <ul id="suggestionsList" class="suggestions-dropdown"></ul>
        </div>

        <!-- ফলাফল প্রদর্শন -->
        <div id="resultsContainer" class="results-wrapper"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
