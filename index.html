<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wareligent Search</title>
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">

    <div class="wrapper">
        <!-- হেডার -->
        <header class="navbar">
            <div class="nav-brand">wareligent<span>.search</span></div>
            <div class="nav-actions">
                <button id="themeToggleBtn" class="theme-btn" title="Toggle Theme">
                    <span id="themeIcon">🌙</span>
                </button>
            </div>
        </header>

        <main class="content-area">
            <!-- ব্র্যান্ড লোগো -->
            <div class="brand-container">
                <h1 class="main-logo">wareligent</h1>
                <p class="sub-text">Search the web intelligently</p>
            </div>

            <!-- সার্চ বক্স -->
            <div class="search-section">
                <div class="search-bar">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="Search the web..." autocomplete="off">
                    <button id="clearBtn" class="action-btn" style="display: none;">✕</button>
                    <button id="voiceBtn" class="action-btn" title="Voice Search">🎙️</button>
                </div>
                <ul id="suggestionsList" class="suggestions-box"></ul>
            </div>

            <!-- ফিল্টার ক্যাটাগরি (সার্চ করার পর দেখাবে) -->
            <div class="category-tabs" id="categoryTabs" style="display: none;">
                <button class="tab-chip active">All</button>
                <button class="tab-chip">Images</button>
                <button class="tab-chip">News</button>
                <button class="tab-chip">Videos</button>
            </div>

            <!-- ট্রেন্ডিং টপিকস (ইউনিক গ্রিড) -->
            <section class="trending-box" id="trendingBox">
                <div class="trending-header">
                    <span>🔥 Trending Topics</span>
                </div>
                <div class="trending-grid" id="trendingGrid">
                    <div class="trend-item" data-query="Artificial Intelligence 2026">
                        <span class="trend-no">01</span>
                        <span class="trend-text">Artificial Intelligence</span>
                    </div>
                    <div class="trend-item" data-query="Latest Tech News">
                        <span class="trend-no">02</span>
                        <span class="trend-text">Latest Tech Updates</span>
                    </div>
                    <div class="trend-item" data-query="Global Space Exploration">
                        <span class="trend-no">03</span>
                        <span class="trend-text">Space Exploration</span>
                    </div>
                    <div class="trend-item" data-query="Web Development Trends">
                        <span class="trend-no">04</span>
                        <span class="trend-text">Web Development</span>
                    </div>
                </div>
            </section>

            <!-- সার্চ রেজাল্ট কন্টেইনার -->
            <div id="resultsWrapper" class="results-container"></div>
        </main>
    </div>

    <script>
        // --- SUPABASE INTEGRATION ---
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_HkyRE170ylT0kkdZxbwUSQ_ihHrS_Ra";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- DATABASE INSERT FUNCTION ---
        async function saveSearchWordToDatabase(word) {
            if (!word) return;
            const cleanWord = word.trim().toLowerCase();

            // Filter out empty queries, domains with dots, or queries shorter than 2 chars
            if (!cleanWord || cleanWord.length < 2 || cleanWord.includes('.')) {
                return;
            }

            try {
                await supabaseClient
                    .from("search_suggestions")
                    .upsert([{ keyword: cleanWord }], { onConflict: "keyword" });
            } catch (err) {
                console.error("Database save error:", err);
            }
        }

        // --- DOM ELEMENTS ---
        const searchInput = document.getElementById('searchInput');
        const suggestionsList = document.getElementById('suggestionsList');
        const resultsWrapper = document.getElementById('resultsWrapper');
        const trendingBox = document.getElementById('trendingBox');
        const categoryTabs = document.getElementById('categoryTabs');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const themeIcon = document.getElementById('themeIcon');
        const clearBtn = document.getElementById('clearBtn');
        const voiceBtn = document.getElementById('voiceBtn');

        let selectedIndex = -1;
        let debounceTimer;

        // SECTION 1: Theme Switcher (Dark/Light)
        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('dark-theme');
            document.body.classList.toggle('light-theme');
            themeIcon.textContent = document.body.classList.contains('dark-theme') ? '☀️' : '🌙';
        });

        // SECTION 2: Input & Clear Button Handling
        searchInput.addEventListener('input', function() {
            const query = this.value.trim();
            clearBtn.style.display = query ? 'block' : 'none';
            selectedIndex = -1;

            if (!query) {
                suggestionsList.innerHTML = '';
                return;
            }

            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                fetchSuggestions(query);
            }, 200);
        });

        clearBtn.addEventListener('click', () => {
            searchInput.value = '';
            clearBtn.style.display = 'none';
            suggestionsList.innerHTML = '';
            resultsWrapper.innerHTML = '';
            categoryTabs.style.display = 'none';
            trendingBox.style.display = 'block';
        });

        // SECTION 3: Keyboard Navigation (Arrow Up/Down, Enter)
        searchInput.addEventListener('keydown', (e) => {
            const items = suggestionsList.querySelectorAll('li');
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (items.length > 0) {
                    selectedIndex = (selectedIndex + 1) % items.length;
                    updateSelection(items);
                }
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (items.length > 0) {
                    selectedIndex = (selectedIndex - 1 + items.length) % items.length;
                    updateSelection(items);
                }
            } else if (e.key === 'Enter') {
                executeSearch();
            }
        });

        function updateSelection(items) {
            items.forEach((item, index) => {
                if (index === selectedIndex) {
                    item.classList.add('selected');
                    searchInput.value = item.dataset.val;
                } else {
                    item.classList.remove('selected');
                }
            });
        }

        // SECTION 4: Real-time Auto-Suggest API (Google API via AllOrigins)
        async function fetchSuggestions(query) {
            try {
                const targetUrl = `https://suggestqueries.google.com/complete/search?client=firefox&q=${encodeURIComponent(query)}`;
                const apiUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
                
                const response = await fetch(apiUrl);
                const data = await response.json();
                const suggestionsData = JSON.parse(data.contents);
                const suggestions = suggestionsData[1] || [];

                renderSuggestions(suggestions);
            } catch (err) {
                console.error("Suggestion Fetch Error:", err);
            }
        }

        function renderSuggestions(suggestions) {
            suggestionsList.innerHTML = '';
            if (suggestions.length === 0) return;

            suggestions.slice(0, 5).forEach((term) => {
                const li = document.createElement('li');
                li.dataset.val = term;
                li.innerHTML = `<span>🔍</span> ${term}`;
                li.onclick = () => {
                    searchInput.value = term;
                    suggestionsList.innerHTML = '';
                    executeSearch(term);
                };
                suggestionsList.appendChild(li);
            });
        }

        // SECTION 5: Trending Items Click Event
        document.querySelectorAll('.trend-item').forEach(item => {
            item.addEventListener('click', function() {
                const query = this.dataset.query;
                searchInput.value = query;
                clearBtn.style.display = 'block';
                executeSearch(query);
            });
        });

        // SECTION 6: Voice Search
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();

            voiceBtn.addEventListener('click', () => {
                recognition.start();
                voiceBtn.style.color = '#ef4444';
            });

            recognition.onresult = (e) => {
                const transcript = e.results[0][0].transcript;
                searchInput.value = transcript;
                voiceBtn.style.color = '';
                executeSearch(transcript);
            };

            recognition.onend = () => { voiceBtn.style.color = ''; };
        }

        // SECTION 7: Search Execution and Advanced Results Display
        async function executeSearch(queryStr) {
            const query = (typeof queryStr === 'string' && queryStr.trim() !== '') ? queryStr.trim() : searchInput.value.trim();
            suggestionsList.innerHTML = '';
            
            if (!query) return;

            // a. Save search word to database
            saveSearchWordToDatabase(query);

            // b. Direct Domain URL check
            const isDomain = /^([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}(\/.*)?$/.test(query);
            const hasProtocol = /^https?:\/\//i.test(query);

            if (isDomain || hasProtocol) {
                const finalUrl = hasProtocol ? query : `https://${query}`;
                window.open(finalUrl, '_blank');
                return;
            }

            // c. General Search Handling
            trendingBox.style.display = 'none';
            categoryTabs.style.display = 'flex';
            resultsWrapper.innerHTML = `<p style="color: var(--text-secondary); text-align: center; padding: 20px;">Searching for "${query}"...</p>`;

            // Open full Google Search in a new tab
            window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');

            // Fetch and render DuckDuckGo Instant Results inside resultsWrapper
            try {
                const res = await fetch(`https://api.duckduckgo.com/?q=${encodeURIComponent(query)}&format=json&origin=*`);
                const data = await res.json();
                resultsWrapper.innerHTML = '';

                // Wikipedia / Abstract Card
                if (data.AbstractText) {
                    const card = document.createElement('div');
                    card.className = 'result-card';
                    card.innerHTML = `
                        <div class="result-header">
                            <img src="https://www.google.com/s2/favicons?domain=${new URL(data.AbstractURL).hostname}&sz=32" class="site-icon" alt="">
                            <span class="site-url">${data.AbstractSource || 'Instant Answer'}</span>
                        </div>
                        <a href="${data.AbstractURL}" target="_blank" class="result-title">${data.Heading || query}</a>
                        <p class="result-snippet">${data.AbstractText}</p>
                    `;
                    resultsWrapper.appendChild(card);
                }

                // Related Topics / Links
                if (data.RelatedTopics && data.RelatedTopics.length > 0) {
                    data.RelatedTopics.slice(0, 5).forEach(topic => {
                        if (topic.Text && topic.FirstURL) {
                            const domain = new URL(topic.FirstURL).hostname;
                            const card = document.createElement('div');
                            card.className = 'result-card';
                            card.innerHTML = `
                                <div class="result-header">
                                    <img src="https://www.google.com/s2/favicons?domain=${domain}&sz=32" class="site-icon" alt="">
                                    <span class="site-url">${domain}</span>
                                </div>
                                <a href="${topic.FirstURL}" target="_blank" class="result-title">${topic.Text.split(' - ')[0]}</a>
                                <p class="result-snippet">${topic.Text}</p>
                            `;
                            resultsWrapper.appendChild(card);
                        }
                    });
                }

                // Fallback message if no instant items were returned
                if (resultsWrapper.innerHTML === '') {
                    resultsWrapper.innerHTML = `
                        <p style="color: var(--text-secondary); text-align: center; padding: 20px;">
                            Full search results opened in a new tab.<br>
                            <a href="https://www.google.com/search?q=${encodeURIComponent(query)}" target="_blank" style="color: var(--accent-color); text-decoration: underline;">Click here</a> if Google search didn't open automatically.
                        </p>`;
                }
            } catch (err) {
                resultsWrapper.innerHTML = `<p style="color: var(--text-secondary); text-align: center; padding: 20px;">Results opened in a new window.</p>`;
            }
        }
    </script>
</body>
</html>
