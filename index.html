<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wareligent Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">

    <div class="wrapper">
        <!-- হেডার -->
        <header class="navbar">
            <div class="nav-brand">wareligent<span>search</span></div>
            <div class="nav-actions">
                <button id="themeToggleBtn" class="theme-btn" title="Toggle Theme">
                    <span id="themeIcon">🌙</span>
                </button>
            </div>
        </header>

        <main class="content-area">
            <!-- ব্র্যান্ড লোগো -->
            <div class="brand-container">
                <h1 class="main-logo">wareligent</h1>
                <p class="sub-text">Search the web intelligently</p>
            </div>

            <!-- সার্চ বক্স -->
            <div class="search-section">
                <div class="search-bar">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" placeholder="​Search the web..." autocomplete="off">
                    <button id="clearBtn" class="action-btn" style="display: none;">✕</button>
                    <button id="voiceBtn" class="action-btn" title="Voice Search">🎙️</button>
                </div>
                <ul id="suggestionsList" class="suggestions-box"></ul>
            </div>

            <!-- ফিল্টার ক্যাটাগরি (সার্চ করার পর দেখাবে) -->
            <div class="category-tabs" id="categoryTabs" style="display: none;">
                <button class="tab-chip active">All</button>
                <button class="tab-chip">Images</button>
                <button class="tab-chip">News</button>
                <button class="tab-chip">Videos</button>
            </div>

            <!-- ট্রেন্ডিং টপিকস (ইউনিক গ্রিড) -->
            <section class="trending-box" id="trendingBox">
                <div class="trending-header">
                    <span>🔥 Trending Topics</span>
                </div>
                <div class="trending-grid" id="trendingGrid">
                    <div class="trend-item" data-query="Artificial Intelligence 2026">
                        <span class="trend-no">01</span>
                        <span class="trend-text">Artificial Intelligence</span>
                    </div>
                    <div class="trend-item" data-query="Latest Tech News">
                        <span class="trend-no">02</span>
                        <span class="trend-text">Latest Tech Updates</span>
                    </div>
                    <div class="trend-item" data-query="Global Space Exploration">
                        <span class="trend-no">03</span>
                        <span class="trend-text">Space Exploration</span>
                    </div>
                    <div class="trend-item" data-query="Web Development Trends">
                        <span class="trend-no">04</span>
                        <span class="trend-text">Web Development</span>
                    </div>
                </div>
            </section>

            <!-- সার্চ রেজাল্ট কন্টেইনার -->
            <div id="resultsWrapper" class="results-container"></div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
