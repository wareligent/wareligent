    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Styles */
        :root {
            --bg-color: #fcfcfd;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --accent-color: #2563eb;
            --border-color: #e2e8f0;
            --shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 4px 12px -2px rgba(0, 0, 0, 0.03);
            --shadow-hover: 0 20px 40px -15px rgba(37, 99, 235, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        /* Subtle Background Glow */
        .bg-glow {
            position: absolute;
            top: -150px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(37,99,235,0.06) 0%, rgba(255,255,255,0) 70%);
            z-index: -1;
            pointer-events: none;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 5%;
            width: 100%;
        }

        .logo-small {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-main);
            font-weight: 700;
            font-size: 1.2rem;
        }

        .logo-icon {
            font-size: 1.4rem;
            color: var(--text-main);
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--text-main);
        }

        .nav-links a.active {
            border-bottom: 2px solid var(--text-main);
            padding-bottom: 4px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .icon-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.3s;
        }

        .icon-btn:hover {
            color: var(--text-main);
        }

        /* Main Content */
        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: auto 0;
            width: 100%;
            max-width: 900px;
            align-self: center;
        }

        /* Hero Brand */
        .hero-brand {
            text-align: center;
            margin-bottom: 35px;
        }

        .main-logo {
            font-size: 3.5rem;
            margin-bottom: 5px;
            color: var(--text-main);
            display: inline-block;
        }

        .brand-name {
            font-size: 2.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-main);
            margin-bottom: 12px;
        }

        .tagline {
            color: var(--text-muted);
            font-size: 0.85rem;
            letter-spacing: 2px;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* Search Bar */
        .search-container {
            width: 100%;
            max-width: 680px;
            position: relative;
            margin-bottom: 45px;
        }

        .search-box {
            width: 100%;
            padding: 18px 55px 18px 55px;
            border-radius: 50px;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            font-size: 1.05rem;
            color: var(--text-main);
            outline: none;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }

        .search-box:focus {
            border-color: #cbd5e1;
            box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.08);
        }

        .search-box::placeholder {
            color: #94a3b8;
        }

        .search-icon {
            position: absolute;
            left: 22px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .mic-icon {
            position: absolute;
            right: 22px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1.1rem;
            cursor: pointer;
            transition: color 0.3s;
        }

        .mic-icon:hover {
            color: var(--accent-color);
        }

        /* Feature Cards Grid */
        .features-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 720px;
        }

        .feature-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 22px 15px;
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
        }

        .feature-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
            border-color: #bfdbfe;
        }

        .feature-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: var(--text-main);
            margin-bottom: 12px;
            transition: all 0.3s;
        }

        .feature-card:hover .feature-icon {
            background: var(--accent-color);
            color: #ffffff;
        }

        .feature-title {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .feature-desc {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* Footer */
        footer {
            padding: 25px 5%;
            text-align: center;
            border-top: 1px solid var(--border-color);
            background: var(--card-bg);
        }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            font-weight: 600;
        }

        /* Mobile Responsiveness */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .features-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .brand-name {
                font-size: 2.2rem;
            }

            .main-logo {
                font-size: 2.8rem;
            }

            .tagline {
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <header>

    <main>

        <div class="search-container">

        <div class="features-grid">
            <a href="#" class="feature-card">
                <div class="feature-icon">
                    <i class="fa-solid fa-globe"></i>
                </div>
                <div class="feature-title">Web</div>
                <div class="feature-desc">Real-time results</div>
            </a>

            <a href="#" class="feature-card">
                <div class="feature-icon">
                    <i class="fa-regular fa-image"></i>
                </div>
                <div class="feature-title">Images</div>
                <div class="feature-desc">Visual search</div>

            <a href="#" class="feature-card">

                    <i class="fa-regular fa-circle-play"></i>
                </div>

                <div class="feature-desc">Watch instantly</div>
            </a>

            <a href="#" class="feature-card">
                <div class="feature-icon">

                </div>
                <div class="feature-title">News</div>
                <div class="feature-desc">Trusted sources</div>
            </a>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="footer-links">
            <span>FASTER</span>
            <span>/</span>
            <span>SMARTER</span>
            <span>/</span>
            <span>WORLDWIDE</span>
        </div>
    </footer>

    <!-- Simple Search Event Script -->
    <script>
        const searchInput = document.querySelector('.search-box');
        
        searchInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && this.value.trim() !== '') {
                alert('Searching for: ' + this.value);
                // Here you can redirect to search results page
                // window.location.href = `https://www.google.com/search?q=${encodeURIComponent(this.value)}`;
            }
        });
    </script>
